name: Workflow lint

# zizmor, shared from 0xPolygon/pipelines. No path filter, so it can be made a
# required check: a check skipped by a path filter stays pending.
on:
  pull_request:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read
      actions: read
      security-events: write # SARIF upload to code scanning
    uses: 0xPolygon/pipelines/.github/workflows/security-zizmor.yml@cb7db0e0135424415839eefb4a81052a84cda278 # main, 2026-11-16
