name: Workflow lint

# zizmor, shared from 0xPolygon/pipelines. No path filter, so it can be made a
# required check: a check skipped by a path filter stays pending.
on:
  pull_request:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read
      actions: read
      security-events: write # SARIF upload to code scanning
    uses: 0xPolygon/pipelines/.github/workflows/security-zizmor.yml@8674784067b26bea487d811e546dffb0c7d0158e # 2026-11-17
