name: pnpm format

on:
  workflow_call:
    secrets:
      GH_TOKEN_GIT_COMMIT:
        required: true

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 20
          persist-credentials: false # the commit-back action clones with its own token

      - uses: ./.github/actions/install-dependencies

      - run: pnpm format

      - name: Commit back
        uses: 0xsequence/actions/git-commit@d6560e817fb0e198d271e8c72f4a243d02188a8a # v0.0.4
        env:
          API_TOKEN_GITHUB: ${{ secrets.GH_TOKEN_GIT_COMMIT }}
        with:
          files: './'
          branch: ${{ github.head_ref }}
          commit_message: '[AUTOMATED] pnpm format'
