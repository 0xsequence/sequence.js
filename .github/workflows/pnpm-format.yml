name: pnpm format

on:
  workflow_call:
    secrets:
      GH_TOKEN_GIT_COMMIT:
        required: true

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 20
          persist-credentials: false # the commit-back action clones with its own token

      - uses: ./.github/actions/install-dependencies

      - run: pnpm format

      - name: Commit back
        uses: 0xsequence/actions/git-commit@d6560e817fb0e198d271e8c72f4a243d02188a8a # v0.0.4
        env:
          API_TOKEN_GITHUB: ${{ secrets.GH_TOKEN_GIT_COMMIT }}
        with:
          files: './'
          branch: ${{ github.head_ref }}
          commit_message: '[AUTOMATED] pnpm format'
